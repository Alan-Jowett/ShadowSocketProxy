[package]
name = "shadow-socket-proxy-xtask"
version = "0.1.0"
edition = "2021"
description = "Provision and build ShadowSocketProxy components"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
