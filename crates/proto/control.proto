syntax = "proto3";

package shadow_socket_proxy.control.v1;

message Empty {}

message InterfaceRequest {
  string elf_path = 1;
  repeated string interfaces = 2;
}

message DetachRequest {
  repeated string interfaces = 1;
  bool all = 2;
}

message OperationReply {
  bool success = 1;
  string message = 2;
  repeated string failures = 3;
}

message Tuple {
  uint32 family = 1;
  bytes source_address = 2;
  bytes destination_address = 3;
  uint32 protocol = 4;
  uint32 source_port = 5;
  uint32 destination_port = 6;
}

message Mapping {
  Tuple synthetic = 1;
  Tuple original = 2;
  uint64 last_seen_ns = 3;
  uint32 protocol_flags = 4;
  uint32 tcp_state_flags = 5;
}

message ListMappingsRequest {
  uint32 limit = 1;
  bytes page_token = 2;
}

message ListMappingsReply {
  repeated Mapping mappings = 1;
  bytes next_page_token = 2;
  uint64 skipped_entries = 3;
}

message Flow {
  uint64 flow_id = 1;
  uint32 generation = 2;
  Tuple synthetic = 3;
  Tuple original = 4;
  uint32 protocol = 5;
  uint64 last_used_ns = 6;
  uint32 tcp_state_flags = 7;
  uint32 protocol_flags = 8;
  uint64 observed_now_ns = 9;
  uint32 fin_seen_mask = 10;
  uint32 fin_ack_seen_mask = 11;
}

message EnumerateFlowsRequest {
  uint32 limit = 1;
  bytes page_token = 2;
}

message EnumerateFlowsReply {
  repeated Flow flows = 1;
  bytes next_page_token = 2;
}

message DeleteFlowRequest {
  uint64 flow_id = 1;
  uint32 generation = 2;
}

message DeleteFlowReply {
  enum Outcome {
    COMPLETE = 0;
    ALREADY_ABSENT = 1;
    STALE_GENERATION = 2;
    PARTIAL = 3;
  }
  Outcome outcome = 1;
  uint64 flow_id = 2;
  uint32 generation = 3;
  uint32 indexes_deleted = 4;
  bool state_deleted = 5;
  bool retryable = 6;
}

message GetMappingRequest {
  Tuple synthetic = 1;
}

message StatusReply {
  bool ready = 1;
  uint32 abi_version = 2;
  repeated string attachments = 3;
  reserved 4, 5, 6, 7, 8, 9, 11, 12;
  reserved "scanned", "retained", "deleted", "errors", "last_error",
    "policy_misses", "partial_cleanups", "policy_map_max_entries";
  uint64 flow_insert_failures = 10;
  uint32 flow_index_map_max_entries = 13;
  uint32 flow_state_map_max_entries = 14;
  uint64 target_misses = 15;
  uint64 control_bypasses = 16;
}

message Config {
  reserved 1, 3;
  reserved "cleanup_interval_ms", "map_scan_batch";
  uint64 idle_ttl_ms = 2;
  uint32 log_capacity = 4;
  reserved 5;
  reserved "destination_policy_capacity";
  uint32 active_flow_capacity = 6;
  uint64 tcp_terminal_grace_ms = 7;
  uint32 schema_version = 8;
  bytes ipv4_target_address = 9;
  uint32 ipv4_target_port = 10;
  bytes ipv6_target_address = 11;
  uint32 ipv6_target_port = 12;
  uint32 listener_family = 13;
  bytes listener_address = 14;
  uint32 listener_port = 15;
  bool listener_ipv4_wildcard = 16;
  bool listener_ipv6_wildcard = 17;
}

message ConfigReply {
  uint64 revision = 1;
  Config config = 2;
}

message SetConfigRequest {
  Config config = 1;
}

message PullLogsRequest {
  uint64 cursor = 1;
  uint32 limit = 2;
}

message LogRecord {
  uint64 sequence = 1;
  string level = 2;
  string message = 3;
}

message PullLogsReply {
  repeated LogRecord records = 1;
  uint64 next_cursor = 2;
}

message HealthReply {
  bool live = 1;
  bool ready = 2;
}

service Control {
  rpc Attach(InterfaceRequest) returns (OperationReply);
  rpc Detach(DetachRequest) returns (OperationReply);
  rpc ListMappings(ListMappingsRequest) returns (ListMappingsReply);
  rpc GetMapping(GetMappingRequest) returns (Mapping);
  rpc EnumerateFlows(EnumerateFlowsRequest) returns (EnumerateFlowsReply);
  rpc DeleteFlow(DeleteFlowRequest) returns (DeleteFlowReply);
  rpc GetStatus(Empty) returns (StatusReply);
  rpc GetConfig(Empty) returns (ConfigReply);
  rpc SetConfig(SetConfigRequest) returns (ConfigReply);
  rpc PullLogs(PullLogsRequest) returns (PullLogsReply);
  rpc Health(Empty) returns (HealthReply);
}
