[package]
name = "shadow-socket-proxy-e2e-runner"
version = "0.1.0"
edition = "2021"
description = "Windows/WSL end-to-end validation driver for ShadowSocketProxy"
license = "MIT"

[[bin]]
name = "shadow-socket-proxy-e2e-runner"
path = "src/main.rs"

[features]
default = []
tls-psk = ["dep:hyper-util", "dep:openssl", "dep:tokio-openssl"]
tls-rustls = ["dep:hyper-util", "dep:shadow-socket-proxy-tls-rustls", "dep:tokio-rustls"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
http = "1"
prost = "0.13"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "time"] }
tonic = { version = "0.12", features = ["transport"] }
tower = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
openssl = { version = "0.10.81", optional = true }
tokio-openssl = { version = "0.6.5", optional = true }

[dependencies.shadow-socket-proxy-tls-rustls]
path = "../tls-rustls"
optional = true

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "tls12"]
optional = true

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
