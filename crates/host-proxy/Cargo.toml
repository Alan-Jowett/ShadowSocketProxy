[package]
name = "shadow-socket-proxy-host"
version = "0.1.0"
edition = "2021"
description = "Windows host shadow proxy for ShadowSocketProxy"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "shadow-socket-proxy-host"
path = "src/main.rs"

[[test]]
name = "rustls_startup"
path = "tests/rustls_startup.rs"
required-features = ["tls-rustls"]

[features]
default = []
tls-psk = ["dep:hyper-util", "dep:openssl", "dep:tokio-openssl"]
tls-rustls = ["dep:hyper-util", "dep:shadow-socket-proxy-tls-rustls", "dep:tokio-rustls"]
wsk = ["dep:shadow-socket-proxy-wsk-driver"]

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
prost = "0.13"
http = "1"
thiserror = "1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net", "io-util"] }
tonic = { version = "0.12", features = ["transport"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
shadow-socket-proxy-wsk-driver = { path = "../wsk-driver", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
openssl = { version = "0.10.81", optional = true }
tokio-openssl = { version = "0.6.5", optional = true }

[dependencies.shadow-socket-proxy-tls-rustls]
path = "../tls-rustls"
optional = true

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "tls12"]
optional = true

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[target.'cfg(target_os = "windows")'.dev-dependencies]
futures-util = "0.3"
rcgen = "0.14"
sha2 = "0.10"
shadow-socket-proxy-control = { path = "../control-service", features = ["tls-rustls"] }
tokio-stream = { version = "0.1", features = ["net"] }
