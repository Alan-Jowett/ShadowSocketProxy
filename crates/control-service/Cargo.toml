[package]
name = "shadow-socket-proxy-control"
version = "0.1.0"
edition = "2021"
description = "Linux-targeted container control service for ShadowSocketProxy"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "shadow-socket-proxy-control"
path = "src/main.rs"

[features]
default = []
linux-bpf = []
tls-psk = ["dep:openssl", "dep:tokio-openssl"]
tls-rustls = ["dep:shadow-socket-proxy-tls-rustls", "dep:tokio-rustls"]

[dependencies]
arc-swap = "1.7"
async-trait = "0.1"
futures-util = "0.3"
prost = "0.13"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net", "io-util", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14.0"
openssl = { version = "0.10.81", optional = true }
tokio-openssl = { version = "0.6.5", optional = true }

[dependencies.shadow-socket-proxy-tls-rustls]
path = "../tls-rustls"
optional = true

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "tls12"]
optional = true

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = "0.14"
sha2 = "0.10"
tower = "0.5"
