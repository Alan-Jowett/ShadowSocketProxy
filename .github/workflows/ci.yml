name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-bpf-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            llvm \
            linux-libc-dev \
            libssl-dev \
            pkg-config \
            make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1

      - name: Build BPF artifact
        run: |
          make -C crates/bpf clean all
          mkdir -p artifact
          cp crates/bpf/shadow-socket-proxy.bpf.o artifact/

      - name: Upload BPF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-socket-proxy-bpf
          path: artifact
          if-no-files-found: error

  build-control-service-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install control-service dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1

      - name: Build control-service artifact
        run: |
          cargo build --locked --release -p shadow-socket-proxy-control
          mkdir -p artifact
          cp target/release/shadow-socket-proxy-control artifact/
          printf '%s\n' 'runtime: libssl3 ca-certificates' > artifact/manifest.txt

      - name: Upload control-service artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-socket-proxy-control
          path: artifact
          if-no-files-found: error

  build-host-proxy-artifact:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OpenSSL
        shell: pwsh
        run: |
          winget install --id ShiningLight.OpenSSL.Dev --version 4.0.1 --exact `
            --scope machine --accept-source-agreements --accept-package-agreements

      - name: Verify OpenSSL and configure environment
        shell: pwsh
        run: |
          $openssl = Get-ChildItem -Path 'C:\Program Files' -Directory -Filter 'OpenSSL*' |
            ForEach-Object { Join-Path $_.FullName 'bin\openssl.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if ($null -eq $openssl) { throw "OpenSSL executable was not found" }
          $root = Split-Path (Split-Path $openssl -Parent) -Parent
          "OPENSSL_DIR=$root" >> $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=$root\lib\VC\x64\MD" >> $env:GITHUB_ENV
          "OPENSSL_INCLUDE_DIR=$root\include" >> $env:GITHUB_ENV
          "OPENSSL_ROOT=$root" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1

      - name: Build host-proxy artifact
        run: cargo build --locked --release -p shadow-socket-proxy-host --features tls-psk

      - name: Package host-proxy artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item target\release\shadow-socket-proxy-host.exe artifact\
          Get-ChildItem "$env:OPENSSL_ROOT\bin\*.dll" | Copy-Item -Destination artifact\

      - name: Upload host-proxy artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-socket-proxy-host
          path: artifact
          if-no-files-found: error

  e2e-windows-wsl:
    needs:
      - build-bpf-artifact
      - build-control-service-artifact
      - build-host-proxy-artifact
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install and initialize WSL distribution
        shell: pwsh
        run: |
          $distribution = "Ubuntu-22.04"
          if (-not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) {
            throw "wsl.exe is required for Windows/WSL E2E validation"
          }
          $installed = @(
            & wsl.exe --list --quiet 2>$null |
              ForEach-Object { ($_ -replace "`0", "").Trim() } |
              Where-Object { $_ }
          )
          if ($installed -notcontains $distribution) {
            & wsl.exe --install --distribution $distribution --no-launch
            if ($LASTEXITCODE -ne 0) {
              throw "WSL distribution installation failed"
            }
          }
          & wsl.exe --set-default $distribution
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to select WSL distribution $distribution"
          }
          & wsl.exe -d $distribution -u root -- uname -a
          if ($LASTEXITCODE -ne 0) {
            throw "WSL distribution $distribution did not initialize"
          }

      - name: Download BPF artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shadow-socket-proxy-bpf
          path: artifacts\bpf

      - name: Download control-service artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shadow-socket-proxy-control
          path: artifacts\control

      - name: Download host-proxy artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shadow-socket-proxy-host
          path: artifacts\host

      - name: Install OpenSSL development package
        shell: pwsh
        run: |
          winget install --id ShiningLight.OpenSSL.Dev --version 4.0.1 --exact `
            --scope machine --accept-source-agreements --accept-package-agreements
          $openssl = Get-ChildItem -Path 'C:\Program Files' -Directory -Filter 'OpenSSL*' |
            ForEach-Object { Join-Path $_.FullName 'bin\openssl.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if ($null -eq $openssl) { throw "OpenSSL executable was not found" }
          $root = Split-Path (Split-Path $openssl -Parent) -Parent
          "OPENSSL_DIR=$root" >> $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=$root\lib\VC\x64\MD" >> $env:GITHUB_ENV
          "OPENSSL_INCLUDE_DIR=$root\include" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1

      - name: Build local E2E driver
        run: cargo build --locked --release -p shadow-socket-proxy-e2e-runner --features tls-psk

      - name: Run Windows/WSL end-to-end validation
        shell: pwsh
        run: |
          .\scripts\run-windows-wsl-e2e.ps1 `
            -BpfArtifact "${{ github.workspace }}\artifacts\bpf\shadow-socket-proxy.bpf.o" `
            -ControlArtifact "${{ github.workspace }}\artifacts\control\shadow-socket-proxy-control" `
            -HostArtifact "${{ github.workspace }}\artifacts\host"

  documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            doxygen \
            graphviz \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1

      - name: Check Rust documentation coverage
        run: python scripts/check-rustdoc.py

      - name: Generate Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --document-private-items

      - name: Generate BPF documentation
        run: |
          rm -rf docs/.generated site
          doxygen docs/Doxyfile

      - name: Assemble documentation site
        run: python scripts/assemble-docs.py --site-dir site

  publish-documentation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            doxygen \
            graphviz \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1

      - name: Validate documentation before publication
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          python scripts/check-rustdoc.py
          cargo doc --locked --workspace --no-deps --document-private-items
          rm -rf docs/.generated site
          doxygen docs/Doxyfile
          python scripts/assemble-docs.py --site-dir site

      - name: Publish clean orphan gh-pages site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a site ../shadow-socket-proxy-published-site
          git checkout --orphan gh-pages
          git rm -rf . || true
          git clean -fdx
          cp -a ../shadow-socket-proxy-published-site/. .
          rm -rf ../shadow-socket-proxy-published-site
          touch .nojekyll
          git add -A
          git commit -m "Publish documentation for ${GITHUB_SHA}"
          git push origin HEAD:gh-pages --force

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            llvm \
            linux-libc-dev \
            libssl-dev \
            pkg-config \
            make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --locked --workspace

      - name: Build canonical BPF and fixture runner
        run: make -C crates/bpf clean all

      - name: Run workspace tests and BPF fixture gate
        env:
          SSP_TEST_BPF_PROG_RUN: "1"
          SSP_TEST_BPF_ELF: ${{ github.workspace }}/crates/bpf/shadow-socket-proxy.bpf.o
          SSP_BPF_PROG_TEST_RUNNER: ${{ github.workspace }}/crates/bpf/ssp-bpf-fixture-runner
        run: |
          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "CARGO_HOME=$CARGO_HOME" \
            "RUSTUP_HOME=$RUSTUP_HOME" \
            "SSP_TEST_BPF_PROG_RUN=$SSP_TEST_BPF_PROG_RUN" \
            "SSP_TEST_BPF_ELF=$SSP_TEST_BPF_ELF" \
            "SSP_BPF_PROG_TEST_RUNNER=$SSP_BPF_PROG_TEST_RUNNER" \
            cargo test --locked --workspace

  validate-host-proxy-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OpenSSL
        shell: pwsh
        run: |
          winget install --id ShiningLight.OpenSSL.Dev --version 4.0.1 --exact `
            --scope machine --accept-source-agreements --accept-package-agreements

      - name: Verify OpenSSL
        shell: pwsh
        run: |
          $package = winget list --id ShiningLight.OpenSSL.Dev --exact `
            --accept-source-agreements | Out-String
          if ($package -notmatch '(?m)(?<![\d.])4\.0\.1(?![\d.])') {
            throw "Expected ShiningLight.OpenSSL.Dev version 4.0.1. Installed packages: $package"
          }

          $openssl = Get-ChildItem -Path 'C:\Program Files' -Directory -Filter 'OpenSSL*' |
            ForEach-Object { Join-Path $_.FullName 'bin\openssl.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if ($null -eq $openssl) {
            throw "OpenSSL executable was not found under C:\Program Files"
          }

          $version = (& $openssl version 2>&1 | Out-String).Trim()
          Write-Output $version
          if ($version -notmatch 'OpenSSL 4\.0\.1') {
            throw "Expected OpenSSL 4.0.1, got: $version"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSL version check failed"
          }

          $pskCiphers = (& $openssl ciphers -v 'PSK-AES256-GCM-SHA384' 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $pskCiphers -notmatch '(?m)^PSK-AES256-GCM-SHA384\s') {
            throw "OpenSSL does not expose PSK-AES256-GCM-SHA384: $pskCiphers"
          }

          $opensslRoot = Split-Path (Split-Path $openssl -Parent) -Parent
          "OPENSSL_DIR=$opensslRoot" >> $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=$opensslRoot\lib\VC\x64\MD" >> $env:GITHUB_ENV
          "OPENSSL_INCLUDE_DIR=$opensslRoot\include" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run host-proxy clippy
        run: cargo clippy --locked -p shadow-socket-proxy-host --features tls-psk --all-targets -- -D warnings

      - name: Build host-proxy with TLS-PSK
        run: cargo build --locked -p shadow-socket-proxy-host --features tls-psk

      - name: Test host-proxy with TLS-PSK
        run: cargo test --locked -p shadow-socket-proxy-host --features tls-psk
