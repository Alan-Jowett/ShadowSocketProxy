name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            llvm \
            linux-libc-dev \
            libssl-dev \
            pkg-config \
            make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --locked --workspace

      - name: Build canonical BPF and fixture runner
        run: make -C crates/bpf clean all

      - name: Run workspace tests and BPF fixture gate
        env:
          SSP_TEST_BPF_PROG_RUN: "1"
          SSP_TEST_BPF_ELF: ${{ github.workspace }}/crates/bpf/shadow-socket-proxy.bpf.o
          SSP_BPF_PROG_TEST_RUNNER: ${{ github.workspace }}/crates/bpf/ssp-bpf-fixture-runner
        run: |
          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "CARGO_HOME=$CARGO_HOME" \
            "RUSTUP_HOME=$RUSTUP_HOME" \
            "SSP_TEST_BPF_PROG_RUN=$SSP_TEST_BPF_PROG_RUN" \
            "SSP_TEST_BPF_ELF=$SSP_TEST_BPF_ELF" \
            "SSP_BPF_PROG_TEST_RUNNER=$SSP_BPF_PROG_TEST_RUNNER" \
            cargo test --locked --workspace

  validate-host-proxy-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OpenSSL
        shell: pwsh
        run: |
          winget install --id ShiningLight.OpenSSL.Dev --version 4.0.1 --exact `
            --scope machine --accept-source-agreements --accept-package-agreements

      - name: Verify OpenSSL
        shell: pwsh
        run: |
          $package = winget list --id ShiningLight.OpenSSL.Dev --exact `
            --accept-source-agreements | Out-String
          if ($package -notmatch '4\.0\.1') {
            throw "Expected ShiningLight.OpenSSL.Dev version 4.0.1. Installed packages: $package"
          }

          $openssl = 'C:\Program Files\OpenSSL-Win64\bin\openssl.exe'
          if (-not (Test-Path $openssl)) {
            throw "OpenSSL executable not found at $openssl"
          }
          & $openssl version
          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSL version check failed"
          }

      - name: Set OpenSSL environment
        shell: pwsh
        run: |
          "OPENSSL_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=C:\Program Files\OpenSSL-Win64\lib\VC\x64\MD" >> $env:GITHUB_ENV
          "OPENSSL_INCLUDE_DIR=C:\Program Files\OpenSSL-Win64\include" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run host-proxy clippy
        run: cargo clippy --locked -p shadow-socket-proxy-host --features tls-psk --all-targets -- -D warnings

      - name: Build host-proxy with TLS-PSK
        run: cargo build --locked -p shadow-socket-proxy-host --features tls-psk

      - name: Test host-proxy with TLS-PSK
        run: cargo test --locked -p shadow-socket-proxy-host --features tls-psk
