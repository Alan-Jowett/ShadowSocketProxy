name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            llvm \
            linux-libc-dev \
            libssl-dev \
            pkg-config \
            make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Build canonical BPF and fixture runner
        run: make -C crates/bpf clean all

      - name: Run workspace tests and BPF fixture gate
        env:
          SSP_TEST_BPF_PROG_RUN: "1"
          SSP_TEST_BPF_ELF: ${{ github.workspace }}/crates/bpf/shadow-socket-proxy.bpf.o
          SSP_BPF_PROG_TEST_RUNNER: ${{ github.workspace }}/crates/bpf/ssp-bpf-fixture-runner
        run: |
          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "CARGO_HOME=$CARGO_HOME" \
            "RUSTUP_HOME=$RUSTUP_HOME" \
            "SSP_TEST_BPF_PROG_RUN=$SSP_TEST_BPF_PROG_RUN" \
            "SSP_TEST_BPF_ELF=$SSP_TEST_BPF_ELF" \
            "SSP_BPF_PROG_TEST_RUNNER=$SSP_BPF_PROG_TEST_RUNNER" \
            cargo test --workspace
